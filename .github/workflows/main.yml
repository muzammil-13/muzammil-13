name: Update README
on:
  schedule:
    - cron: '0 0 * * *'  # Run once a day at midnight
  workflow_dispatch:  # Manual trigger option
  push:
    branches:
      - main

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Explicit permissions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README
        run: |
          # This command will find a line containing "Last Updated:" and replace it with the current date.
          # Make sure your README.md has a line like "Last Updated: YYYY-MM-DD" for this to work.
          sed -i "s/Last Updated: .*/Last Updated: $(date '+%Y-%m-%d')/" README.md

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          if ! git diff --staged --quiet; then
            git commit -m "docs: update README with latest information"
            git push
          fi